<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock & RoboBites</title>  
    
        <!-- Bootstrap y estilos -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../CSS/estilos.css"> <!-- Archivo de estilos externo -->
    
        <!-- Leaflet.js (Mapa) -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    </head>
<body>
    <!-- Incluir Encabezado -->
    <div id="header"></div>

    <div id="sound-box"></div>
    
    <!-- Contenido Principal -->
    <main class="container my-4">
        <h1 class="text-center">Menú del Restaurante</h1>
        
        <!-- Sección de Tapas en Horizontal -->
        <div class="row flex-nowrap overflow-auto pb-3">
            <div class="col-md-3">
                <div class="card">
                    <img src="../IMAGENES/tapa1.jpg" class="card-img-top" alt="Tapa 1">
                    <div class="card-body text-center">
                        <h5 class="card-title">Torrezno de Soria</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <img src="../IMAGENES/tapa2.jpg" class="card-img-top" alt="Tapa 2">
                    <div class="card-body text-center">
                        <h5 class="card-title">Patatas bravas</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <img src="../IMAGENES/tapa3.jpg" class="card-img-top" alt="Tapa 3">
                    <div class="card-body text-center">
                        <h5 class="card-title">Huevos rotos</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <img src="../IMAGENES/tapa4.jpg" class="card-img-top" alt="Tapa 4">
                    <div class="card-body text-center">
                        <h5 class="card-title">Ensaladilla rusa</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección de Platos en 3 Columnas -->
        <div class="row mt-4">
            <div class="col-md-4">
                <h2 class="text-center">Hamburguesas</h2>
                <div class="row">
                    <div class="col-12 mb-3" id="hamburguesas"></div>
                </div>
            </div>
            <div class="col-md-4">
                <h2 class="text-center">Pizzas</h2>
                <div class="row">
                    <div class="col-12 mb-3" id="pizzas"></div>
                </div>
            </div>
            <div class="col-md-4">
                <h2 class="text-center">Pescados</h2>
                <div class="row">
                    <div class="col-12 mb-3" id="mariscos"></div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Incluir Pie de Página -->
    <div id="footer"></div>

    <!-- Cargar Encabezado y Pie de Página Dinámicamente -->
    <script src="../JS/header.js"></script>
    <script src="../JS/footer.js"></script>
    <script src="../JS/sound-box.js"></script>

    <!--Script del Mapa -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="../JS/scripts-sound-box.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Datos de los productos
        const productos = {
            hamburguesas: [
                { img: "../IMAGENES/hamburguesa1.jpg", nombre: "Hamburguesa Clásica" },
                { img: "../IMAGENES/hamburguesa2.jpg", nombre: "Hamburguesa BBQ" },
                { img: "../IMAGENES/hamburguesa3.jpg", nombre: "Hamburguesa Vegana" },
            ],
            pizzas: [
                { img: "../IMAGENES/pizza1.jpg", nombre: "Pizza Margarita" },
                { img: "../IMAGENES/pizza2.jpg", nombre: "Pizza Pepperoni" },
                { img: "../IMAGENES/pizza3.jpg", nombre: "Pizza Cuatro Quesos" },
            ],
            mariscos: [
                { img: "../IMAGENES/marisco1.jpg", nombre: "Gambas al Ajillo" },
                { img: "../IMAGENES/marisco2.jpg", nombre: "Paella de Mariscos" },
                { img: "../IMAGENES/marisco3.jpg", nombre: "Pulpo a la Gallega" },
            ]
        };

        // Función para renderizar productos en cada sección
        function renderizarProductos(id, productos) {
            let contenedor = document.getElementById(id);
            productos.forEach(producto => {
                contenedor.innerHTML += `
                    <div class='card mb-3'>
                        <img src='${producto.img}' class='card-img-top' alt='${producto.nombre}'>
                        <div class='card-body text-center'>
                            <h5 class='card-title'>${producto.nombre}</h5>
                        </div>
                    </div>`;
            });
        }

        renderizarProductos("hamburguesas", productos.hamburguesas);
        renderizarProductos("pizzas", productos.pizzas);
        renderizarProductos("mariscos", productos.mariscos);

        document.addEventListener("DOMContentLoaded", function () {
          var restaurantCoords = [39.51386065006829, -0.425216139489487];

          var map = L.map('footer-map', {
              center: restaurantCoords,
              zoom: 15,
              scrollWheelZoom: false
          });

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }).addTo(map);

          L.marker(restaurantCoords).addTo(map)
              .bindPopup("<b>Rock & Robobites</b><br>¡Ven a visitarnos!").openPopup();

          setTimeout(() => { map.invalidateSize(); }, 500); // Asegurar que el mapa se ajuste correctamente
      });
    </script>
</body>
</html>
