<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../JS/juego.js"></script>

    <title>Juego</title>

    <!-- Bootstrap y estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/estilos.css"> <!-- Archivo de estilos externo -->

    <!-- Leaflet.js (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

    <!-- Incluir Encabezado -->
    <div id="header"></div>

    <div id="sound-box"></div>

    <div class="container div-juego">
        <div class="row align-items-start">
          <!-- MENÚ IZQUIERDA -->
          <div class="col-md-3 menu">
            <h3>Nombre de los jugadores</h3>
            <label>Nombre jugador 1</label>
            <input type="text" id="jugador1" placeholder="Jugador1" class="form-control">
            <label>Nombre jugador 2</label>
            <input type="text" id="jugador2" placeholder="Jugador2" class="form-control">
            
            <h3>Dificultad</h3>
            <label>Tamaño pala</label>
            <input type="number" id="tamanoPala" value="50" class="form-control">
            <label>Velocidad</label>
            <input type="number" id="velocidad" value="3" class="form-control">

            <button id="iniciar" class="btn btn-primary mt-3">Iniciar Partida</button>
          </div>
      
          <!-- ÁREA DE JUEGO -->
          <div class="col-md-9 game-container">
            <canvas id="canvas"></canvas>
          </div>
        </div>
      </div>

    <!-- Incluir Pie de Página -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Cargar Encabezado y Pie de Página Dinámicamente -->
    <script src="../JS/header.js"></script>
    <script src="../JS/footer.js"></script>
    <script src="../JS/sound-box.js"></script>

    <!--Script del Mapa -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="../JS/scripts-sound-box.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var restaurantCoords = [39.51386065006829, -0.425216139489487];

        var map = L.map('footer-map', {
            center: restaurantCoords,
            zoom: 15,
            scrollWheelZoom: false
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        L.marker(restaurantCoords).addTo(map)
            .bindPopup("<b>Rock & Robobites</b><br>¡Ven a visitarnos!").openPopup();

        setTimeout(() => { map.invalidateSize(); }, 500);
    });

    document.addEventListener("DOMContentLoaded", function () {
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");
        const fondoImg = new Image();
        fondoImg.src = "../IMAGENES/resturante.png";

        // Ajustar tamaño del canvas
        canvas.width = 800;
        canvas.height = 400;

        function drawCourt() {
            // Dibuja la imagen de fondo ocupando todo el canvas
            ctx.drawImage(fondoImg, 0, 0, canvas.width, canvas.height);
        }

        drawCourt();
    });
    </script>
</body>
</html>
